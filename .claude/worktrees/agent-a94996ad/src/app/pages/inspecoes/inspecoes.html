<div class="page-container">
  <div class="page-header">
    <div>
      <h1><mat-icon>checklist</mat-icon> Inspeções (Pré-viagem)</h1>
      <p>Checklist de vistoria dos veículos</p>
    </div>
    <button mat-raised-button color="primary" (click)="openForm()"><mat-icon>add</mat-icon> Nova Inspeção</button>
  </div>

  <mat-card>
    <mat-card-content>
      @if (loading()) { <mat-progress-bar mode="indeterminate"></mat-progress-bar> }
      <div class="table-responsive">
        <table mat-table [dataSource]="inspecoes()">
          <ng-container matColumnDef="data">
            <th mat-header-cell *matHeaderCellDef>Data/Hora</th>
            <td mat-cell *matCellDef="let i">{{ i.data_hora | date:'dd/MM/yyyy HH:mm' }}</td>
          </ng-container>
          <ng-container matColumnDef="placa">
            <th mat-header-cell *matHeaderCellDef>Veículo</th>
            <td mat-cell *matCellDef="let i"><strong class="placa">{{ i.placa }}</strong></td>
          </ng-container>
          <ng-container matColumnDef="motorista_nome">
            <th mat-header-cell *matHeaderCellDef>Motorista</th>
            <td mat-cell *matCellDef="let i">{{ i.motorista_nome }}</td>
          </ng-container>
          <ng-container matColumnDef="odometro">
            <th mat-header-cell *matHeaderCellDef>Odômetro</th>
            <td mat-cell *matCellDef="let i">{{ i.odometro }} km</td>
          </ng-container>
          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef>Status</th>
            <td mat-cell *matCellDef="let i">
              <mat-chip [color]="i.status === 'Aprovado' ? 'primary' : 'warn'" selected>{{ i.status }}</mat-chip>
            </td>
          </ng-container>
          <ng-container matColumnDef="acoes">
            <th mat-header-cell *matHeaderCellDef>Ações</th>
            <td mat-cell *matCellDef="let i">
              <button mat-icon-button color="primary" (click)="openForm(i)"><mat-icon>visibility</mat-icon></button>
              <button mat-icon-button color="warn" (click)="delete(i)"><mat-icon>delete</mat-icon></button>
            </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="cols"></tr>
          <tr mat-row *matRowDef="let row; columns: cols;"></tr>
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell no-data" [attr.colspan]="cols.length">Nenhuma inspeção encontrada</td>
          </tr>
        </table>
      </div>
    </mat-card-content>
  </mat-card>
</div>
