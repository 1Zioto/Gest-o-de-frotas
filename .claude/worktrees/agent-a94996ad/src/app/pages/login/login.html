<div class="login-container">
  <mat-card class="login-card">
    <div class="login-logo">
      <div class="logo-wrap">
        <mat-icon class="logo-icon">local_shipping</mat-icon>
      </div>
      <h1>Gestão de Frota</h1>
      <p>Sistema de Gerenciamento de Frotas</p>
    </div>
    <mat-card-content>
      <form (ngSubmit)="onSubmit()" #form="ngForm">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Login</mat-label>
          <input matInput [(ngModel)]="loginForm.login" name="login" required placeholder="Digite seu login">
          <mat-icon matPrefix>person</mat-icon>
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Senha</mat-label>
          <input matInput [(ngModel)]="loginForm.password" name="password" [type]="hidePassword() ? 'password' : 'text'" required>
          <mat-icon matPrefix>lock</mat-icon>
          <button mat-icon-button matSuffix type="button" (click)="hidePassword.set(!hidePassword())">
            <mat-icon>{{ hidePassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>
        <button mat-raised-button color="primary" type="submit" class="login-btn" [disabled]="loading()">
          @if (loading()) {
            <mat-spinner diameter="20"></mat-spinner>
          } @else {
            <ng-container>
              <mat-icon>login</mat-icon> Entrar
            </ng-container>
          }
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
